<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Compare lawyer combinations for the Alliance Support Center in Last War: Survival Game.">
  <title>Last War Alliance Support Comparator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101f;
      --panel: rgba(18, 31, 51, .88);
      --line: rgba(148, 163, 184, .22);
      --text: #f8fafc;
      --muted: #aebbd0;
      --accent: #38bdf8;
      --accent2: #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(37, 99, 235, .28), transparent 31rem),
        radial-gradient(circle at 88% 92%, rgba(14, 165, 233, .18), transparent 28rem),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(26px, 6vw, 54px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(14px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid rgba(56, 189, 248, .32);
      border-radius: 999px;
      color: #bae6fd;
      background: rgba(14, 165, 233, .1);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 22px 0 14px;
      font-size: clamp(2rem, 8vw, 4.1rem);
      line-height: .98;
      letter-spacing: -.055em;
      max-width: 650px;
    }
    p {
      margin: 0;
      max-width: 590px;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    a {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      text-decoration: none;
      font-weight: 850;
      box-shadow: 0 12px 30px rgba(37, 99, 235, .28);
      transition: transform .18s ease, filter .18s ease;
    }
    a:hover { transform: translateY(-2px); filter: brightness(1.08); }
    a:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 4px; }
    .note {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #8291a9;
      font-size: .86rem;
    }
    @media (max-width: 480px) {
      body { padding: 14px; }
      main { border-radius: 22px; }
      .actions, a { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Last War Utility</span>
    <h1>Alliance Support Comparator</h1>
    <p>Compare lawyer combinations for the Alliance Support Center and review their effects for different task durations.</p>
    <div class="actions">
      <a href="lastwar_alliance_support_comparator_v0.92.html">Open Comparator</a>
    </div>
    <div class="note">Version 0.92 · Community-made reference tool</div>
  </main>
</body>
</html>
